name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in public-fonts*.zip; do [ -e "$f" ] && mkdir -p public/fonts && unzip -o "$f" -d public/fonts && rm "$f"; done
          for f in public-images*.zip; do [ -e "$f" ] && mkdir -p public/images && unzip -o "$f" -d public/images && rm "$f"; done
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f" && rm "$f"; done
          true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Add project files"
          git push
